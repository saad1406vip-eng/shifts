<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توزيع جدول المختبر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- لوحة التحكم (تختفي عند الطباعة) -->
    <div class="control-panel no-print">
        <div class="header-controls">
            <img src="logo.png" alt="الشعار" class="logo">
            <h1>نظام توزيع جدول المختبر</h1>
        </div>
        
        <div class="settings">
            <label>الشهر: 
                <select id="monthSelect"></select>
            </label>
            <label>السنة: 
                <input type="number" id="yearInput" value="2026">
            </label>
            <button onclick="generateSchedule()">توليد الجدول</button>
            <button onclick="window.print()">طباعة الجدول</button>
        </div>

        <div class="employee-management">
            <h3>إدارة الموظفين</h3>
            <div class="add-employee">
                <input type="text" id="empName" placeholder="اسم الموظف">
                <input type="text" id="empJob" placeholder="الرقم الوظيفي">
                <select id="empSection">
                    <option value="CHEM & REC">CHEM & REC</option>
                    <option value="CHEM & VIRO">CHEM & VIRO</option>
                    <option value="B/B & HEMA">B/B & HEMA</option>
                    <option value="MICRO & PARA">MICRO & PARA</option>
                </select>
                <select id="empRole">
                    <option value="tech">فني (يشارك في التوزيع)</option>
                    <option value="excluded">مستثنى (طبيب/رئيس/مشرف)</option>
                </select>
                <button onclick="addEmployee()">إضافة موظف</button>
            </div>
            <ul id="employeeList"></ul>
        </div>
    </div>

    <!-- الجدول (يظهر عند الطباعة) -->
    <div class="print-area">
        <div class="print-header">
            <img src="logo.png" alt="الشعار" class="print-logo">
            <div class="print-title">
                <h2>مستشفى سبت العلاية العام</h2>
                <h3>المختبر وبنك الدم</h3>
                <p id="printMonthYear"></p>
            </div>
        </div>

        <table id="scheduleTable">
            <thead>
                <tr>
                    <th rowspan="2">NAME</th>
                    <th rowspan="2">JOB NO.</th>
                    <th rowspan="2">SECTION</th>
                    <th rowspan="2">DAY</th>
                    <!-- سيتم توليد أيام الشهر هنا -->
                </tr>
                <tr id="daysHeaderRow">
                    <!-- أسماء الأيام (TU, WE, TH...) -->
                </tr>
            </thead>
            <tbody id="scheduleBody">
                <!-- سيتم توليد صفوف الموظفين هنا -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
